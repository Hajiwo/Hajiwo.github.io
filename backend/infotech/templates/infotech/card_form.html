{% extends 'infotech/base.html' %}{% load guide %}{% block content %}<main class="container form-main"><a class="back-link" href="{% url 'infotech:section' section %}">← {% t section_title %}</a><h1 class="page-title">{% t title %}</h1><form class="course-form" method="post">{% csrf_token %}{{ form.non_field_errors }}<div class="form-grid">{% for field in form %}<div class="form-field full"><label for="{{ field.id_for_label }}">{{ field.label }}</label>{{ field }}{{ field.errors }}</div>{% endfor %}</div><div class="form-actions"><a class="button secondary" href="{% url 'infotech:section' section %}">{% t 'Cancel' %}</a><button class="button primary" type="submit">{% if editing %}{% t 'Save changes' %}{% else %}{% t 'Add' %}{% endif %}</button></div></form></main>{% endblock %}
