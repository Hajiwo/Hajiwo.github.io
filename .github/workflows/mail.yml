name: Deliver Articles email

on:
  schedule:
    - cron: '3-58/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: articles-mail-delivery
  cancel-in-progress: false

jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MAIL_API_BASE: https://jdchen3398.pythonanywhere.com/api/v1
      MAIL_WORKER_TOKEN: ${{ secrets.MAIL_WORKER_TOKEN }}
      MAIL_SMTP_USER: ${{ secrets.MAIL_SMTP_USER }}
      MAIL_SMTP_PASSWORD: ${{ secrets.MAIL_SMTP_PASSWORD }}
      MAIL_SMTP_HOST: smtp.mail.de
      MAIL_SMTP_PORT: '587'
      MAIL_FROM: 'Articles Notifications <hajiwo9123217@mail.de>'
    steps:
      - uses: actions/checkout@v6
      - name: Deliver queued messages
        run: python scripts/send-mail-outbox.py
